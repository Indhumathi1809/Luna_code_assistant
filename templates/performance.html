<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-<copied_integrity_value>" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Code Performance Analyzer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
            text-align: center;
        }
        header {
            background-color: #007bff;
            color: #fff;
            padding: 10px 0;
        }
        h1 {
            margin-top: 20px;
            letter-spacing: 2px;
            font-size: 30px;
        }
        form {
            margin: 20px auto;
            width: 80%;
        }
        label {
            font-weight: bold;
        }
        textarea, input[type="file"] {
            width: 60%;
            padding: 10px;
            margin: 10px auto;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
            font-size: 15px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            font-size:18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .response-container {
            margin-top: 20px; /* Adjust this margin as needed */
        }
        pre {
            text-align: left;
            white-space: pre-wrap;
            margin: 10px auto;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f0f0f0;
        }
    </style>
    <script>
        function copyToClipboard() {
            var textarea = document.getElementById('assistant_response');
            var code = textarea.value;
    
            // Create a temporary textarea to copy the code
            var tempTextarea = document.createElement('textarea');
            tempTextarea.value = code;
            document.body.appendChild(tempTextarea);
            tempTextarea.select();
            document.execCommand('copy');
            document.body.removeChild(tempTextarea);
            
            alert('Copied code to clipboard!');
        }

        // Resize textarea to fill available space
        window.addEventListener('resize', resizeTextarea);
        window.addEventListener('DOMContentLoaded', resizeTextarea);

        function resizeTextarea() {
            var textarea = document.getElementById('assistant_response');
            var availableWidth = window.innerWidth * 0.8; // 80% of window width
            var availableHeight = window.innerHeight * 0.7; // 70% of window height
            textarea.style.width = availableWidth + 'px';
            textarea.style.height = availableHeight + 'px';
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto'; // Reset the height to auto
            textarea.style.height = textarea.scrollHeight + 'px'; // Set the height to the scroll height
        }
    </script>
</head>
<body>
    <header>
        <h1>Code Performance Analyzer</h1>
    </header>
    <main>
        <form action="/analyze_code" method="post" enctype="multipart/form-data">
            <label for="user_input">Enter your code:</label><br><br>
            <textarea id="user_input" name="user_input" rows="10" cols="80" oninput="autoResize(this)"></textarea><br><br>
            <label for="file">Or upload a file:</label><br><br>
            <input type="file" id="file" name="file"><br><br>
            <button type="submit">Analyze Code <i class="fa fa-spinner fa-spin"></i></button>
        </form>
        
        {% if user_input %}
        <hr>
        <h2>Your Input:</h2>
        <pre>{{ user_input }}</pre>
        
        {% if response %}
        <hr>
        <h2>Performance Analysis:</h2>
        <button onclick="copyToClipboard()" style="margin-left: 70%;">Copy Code <i class="fas fa-copy"></i></button><br><br>
        <textarea id="assistant_response" name="assistant_response" rows="10" cols="50" readonly oninput="autoResize(this)">{{ response }}</textarea><br>
        {% endif %}
        
        {% endif %}
    </main>
</body>
</html>
