<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-<copied_integrity_value>" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Luna-Code Template</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        header {
            background-color: #007bff;
            color: #fff;
            padding: 15px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin: 20px 0;
            font-size: 34px;
            text-align: center;
        }

        form {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
        }

        label {
            font-weight: bold;
            font-size: 18px;
        }

        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: vertical;
            font-size: 16px;
            background: #fff;
        }

        input[type="file"] {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 5px;
            font-size: 16px;
            background: #fff;
            transition: border-color 0.3s;
        }

        input[type="file"]:hover {
            border-color: #007bff;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
        
        .center {
            text-align: center;
        }

        .right-align {
            text-align: right;
        }
    </style>
</head>
<body>
    <header>
        <h1>Code Templates</h1>
    </header>
    
    {% if response %}
        <h1 class="center">Template Code</h1>
        <div class="center">
            <button onclick="copyToClipboard()">
                Copy Code <i class="fas fa-paste"></i>
                <br>
            </button>
        </div>
        <textarea id="template_code" rows="10" oninput="autoResize(this)" style="height:200px;">{{ response }}</textarea>
    {% else %}
        <form action="/template_code" method="post" enctype="multipart/form-data">
            <label for="file_input">Upload a File:</label><br><br>
            <input type="file" id="file_input" name="file_input"><br><br>
            <br>
            <label for="user_input">Or Enter Your Input:</label><br>
            <br>
            <br>
            <textarea id="user_input" name="user_input" rows="4" oninput="autoResize(this)"></textarea><br>
            <br>
            <br>
            <div class="center">
                <button type="submit" title="Click here to generate the template">
                    Generate Template <i class="fas fa-bookmark"></i>
                </button>
            </div>
        </form>
    {% endif %}
    
    <script>
        function copyToClipboard() {
            const textarea = document.getElementById('template_code');
            const code = textarea.value;
            const start = code.indexOf('```');
            const end = code.lastIndexOf('```');
            
            let textToCopy = code;
            if (start !== -1 && end !== -1 && start !== end) {
                textToCopy = code.substring(start + 3, end).trim();
            }
            
            const tempTextarea = document.createElement('textarea');
            tempTextarea.value = textToCopy;
            document.body.appendChild(tempTextarea);
            tempTextarea.select();
            document.execCommand('copy');
            document.body.removeChild(tempTextarea);
            
            alert('Code copied to clipboard!');
        }
        
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        document.addEventListener('DOMContentLoaded', function() {
            const templateTextarea = document.getElementById('template_code');
            if (templateTextarea) {
                autoResize(templateTextarea);
            }
        });
    </script>
</body>
</html>
